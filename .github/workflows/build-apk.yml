name: Compilar APK RaitvCam

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar APK Debug
        run: gradle assembleDebug --stacktrace

      - name: Subir APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaitvCam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK directo en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "RaitvCam APK #${{ github.run_number }}"
          body: "Descarga directa del archivo app-debug.apk para instalar en tu OPPO Reno13 F."
          files: app/build/outputs/apk/debug/app-debug.apk
